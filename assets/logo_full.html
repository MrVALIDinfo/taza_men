<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  .wrap { width: 1200px; height: 400px; display: flex; align-items: center; gap: 48px; padding: 0 72px; box-sizing: border-box; }
  .icon { width: 280px; height: 280px; border-radius: 64px; overflow: hidden; box-shadow: 0 18px 40px rgba(10, 92, 69, 0.28); flex: none; }
  .icon img { width: 100%; height: 100%; display: block; }
  .name { font-family: "Segoe UI", Arial, sans-serif; font-weight: 800; font-size: 132px; letter-spacing: -2px; line-height: 1; color: #0A5C45; }
  .name span { color: #1DBF73; }
  .tag { font-family: "Segoe UI", Arial, sans-serif; font-weight: 600; font-size: 34px; color: #4B6B60; margin-top: 18px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon"><img src="logo_icon.svg" alt=""></div>
    <div>
      <div class="name">Taza<span>Men</span></div>
      <div class="tag">Таза шаар — биздин колдо</div>
    </div>
  </div>
</body>
</html>
