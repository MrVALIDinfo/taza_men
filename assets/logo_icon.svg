<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1DBF73"/>
      <stop offset="1" stop-color="#0A5C45"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- горы на фоне (Тянь-Шань) -->
  <path d="M0 400 L120 300 L190 350 L300 250 L400 330 L512 270 L512 512 L0 512 Z" fill="#064E3B" opacity="0.35"/>

  <!-- тень пина -->
  <ellipse cx="256" cy="420" rx="62" ry="12" fill="#032B21" opacity="0.35"/>

  <!-- пин -->
  <path d="M256 412 C206 350 140 298 140 222 A116 116 0 1 1 372 222 C372 298 306 350 256 412 Z" fill="#FFFFFF"/>

  <!-- лист внутри пина -->
  <g transform="rotate(-35 256 220)">
    <path d="M256 140 C318 158 326 240 256 296 C186 240 194 158 256 140 Z" fill="url(#leaf)"/>
    <path d="M256 158 L256 284" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M256 200 L232 182 M256 230 L282 210 M256 258 L234 240" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- искры чистоты -->
  <path d="M396 120 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M110 140 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5 Z" fill="#FFFFFF" opacity="0.7"/>
</svg>
