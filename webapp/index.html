<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Taza Map</title>
  <link rel="icon" type="image/png" href="/brand/logo_avatar.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- экран загрузки: виден, пока не загрузились карта и данные -->
  <div class="splash" id="splash">
    <img class="splash-logo" src="/brand/logo_avatar.png" alt="">
    <div class="splash-title">Taza Map</div>
    <div class="splash-spinner"></div>
    <div class="splash-text" id="splashText">Жүктөлүүдө… / Загрузка…</div>
  </div>
  <div id="app">
    <!-- шапка -->
    <header class="topbar" id="topbar">
      <img class="topbar-logo" src="/brand/logo_avatar.png" alt="">
      <div class="topbar-text">
        <div class="topbar-title">Taza Map</div>
        <div class="topbar-sub" data-i18n="tagline"></div>
      </div>
      <div class="lang-switch" id="langSwitch">
        <button data-lang="ky">KG</button>
        <button data-lang="ru">RU</button>
      </div>
    </header>

    <main class="views">
      <!-- карта -->
      <section class="view view-map active" id="view-map">
        <div class="map-overlay-top">
          <div class="stats">
            <div class="stat"><b id="statTotal">0</b><span data-i18n="stat_total"></span></div>
            <div class="stat stat-pending"><b id="statPending">0</b><span data-i18n="stat_pending"></span></div>
            <div class="stat stat-approved"><b id="statApproved">0</b><span data-i18n="stat_approved"></span></div>
          </div>
          <div class="chips" id="filterChips"></div>
        </div>
        <div id="map"></div>
        <div class="map-fabs">
          <button class="fab fab-secondary" id="locateBtn" aria-label="locate">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5" fill="none"/></svg>
          </button>
          <button class="fab fab-primary" id="reportBtn">
            <span>📸</span><span data-i18n="report"></span>
          </button>
        </div>

        <!-- режим выбора точки -->
        <div class="pick-overlay" id="pickOverlay" hidden>
          <div class="pick-hint" data-i18n="pick_hint"></div>
          <div class="pick-pin">
            <svg viewBox="0 0 48 64"><path d="M24 62C18 52 4 40 4 24a20 20 0 1 1 40 0c0 16-14 28-20 38Z"/><circle cx="24" cy="24" r="8" fill="#fff"/></svg>
            <div class="pick-shadow"></div>
          </div>
          <div class="pick-coords" id="pickCoords"></div>
        </div>
      </section>

      <!-- мои обращения -->
      <section class="view" id="view-my">
        <div class="scroll">
          <div class="profile card" id="profileCard"></div>
          <h2 class="section-title" data-i18n="my_title"></h2>
          <div class="list" id="myList"></div>
        </div>
      </section>

      <!-- рейтинг -->
      <section class="view" id="view-rating">
        <div class="scroll">
          <div class="card reward-card">
            <div class="reward-emoji">🏆</div>
            <div>
              <div class="reward-title" data-i18n="reward_title"></div>
              <div class="reward-text" id="rewardText"></div>
            </div>
          </div>
          <h2 class="section-title" data-i18n="rating_title"></h2>
          <div class="list" id="ratingList"></div>
        </div>
      </section>

      <!-- модерация -->
      <section class="view" id="view-moderation">
        <div class="scroll">
          <div class="demo-banner" id="demoBanner" hidden data-i18n="demo_banner"></div>
          <h2 class="section-title"><span data-i18n="moderation_title"></span> <span class="count-badge" id="queueCount">0</span></h2>
          <div class="list" id="moderationList"></div>
        </div>
      </section>
    </main>

    <!-- нижние вкладки -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="map">
        <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>
        <span data-i18n="tab_map"></span>
      </button>
      <button class="tab" data-view="my">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span data-i18n="tab_my"></span>
      </button>
      <button class="tab" data-view="rating">
        <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>
        <span data-i18n="tab_rating"></span>
      </button>
      <button class="tab" data-view="moderation" id="moderationTab" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
        <span data-i18n="tab_moderation"></span>
        <i class="tab-dot" id="moderationDot" hidden></i>
      </button>
    </nav>

    <!-- просмотр фото -->
    <div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="/static/app.js"></script>
  <!-- страховка: если скрипты не загрузились (плохая сеть), не держим заставку вечно -->
  <script>setTimeout(function () { var s = document.getElementById("splash"); if (s) s.classList.add("done"); }, 10000);</script>
</body>
</html>
